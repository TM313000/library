<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ライブラリ">
<meta name="robots" content="noindex">
<title>ライブラリ</title>
<style>
/* layout idea: 上にカテゴリのタブ、下に新しい順のページ一覧。スマホの片手操作を基準にした1段組 */
:root{--bg:#f3f4f8;--surface:#ffffff;--ink:#171a2b;--muted:#5b6078;--line:#d9dcea;--accent:#3340c9;
  --body:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1120;--surface:#181b30;--ink:#e8eaf6;--muted:#9aa0bd;--line:#2b2f4c;--accent:#8b96ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1120;--surface:#181b30;--ink:#e8eaf6;--muted:#9aa0bd;--line:#2b2f4c;--accent:#8b96ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 14px}
h1{font-size:1.5rem;margin:0;font-weight:800}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);z-index:5}
.tabs button{font:inherit;font-weight:700;font-size:.95rem;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tabs button:focus-visible,a.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs .n{font-family:var(--mono);font-size:.78rem;margin-left:6px;opacity:.8}
.list{display:flex;flex-direction:column;gap:10px;padding-top:16px}
a.item{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;animation:in .35s ease-out both}
a.item:active{transform:scale(.99)}
.item .t{font-weight:700;font-size:1.02rem}
.item .s{font-size:.86rem;color:var(--muted)}
.item .d{font-family:var(--mono);font-size:.76rem;color:var(--accent)}
.empty{color:var(--muted);padding:26px 4px;font-size:.92rem}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ライブラリ</h1></header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="list" id="list"><p class="empty">読み込み中です。</p></div>
</div>
<script>
(function(){
  var cats = [['stocks','株'],['life','私生活']];
  var tabs = document.getElementById('tabs'), list = document.getElementById('list'), pages = [], cur = 'stocks';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function draw(){
    tabs.innerHTML = cats.map(function(c){
      var n = pages.filter(function(p){ return p.category === c[0]; }).length;
      return '<button role="tab" data-c="' + c[0] + '" aria-selected="' + (c[0] === cur) + '">' + c[1] + '<span class="n">' + n + '</span></button>';
    }).join('');
    var items = pages.filter(function(p){ return p.category === cur; }).sort(function(a, b){ return a.date < b.date ? 1 : -1; });
    list.innerHTML = items.length ? items.map(function(p, i){
      return '<a class="item" style="animation-delay:' + (i * 50) + 'ms" href="' + esc(p.file) + '"><span class="d">' + esc(p.date) + '</span><span class="t">' + esc(p.title) + '</span><span class="s">' + esc(p.note || '') + '</span></a>';
    }).join('') : '<p class="empty">このカテゴリにはまだページがありません。</p>';
  }
  tabs.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cur = b.dataset.c; try { location.hash = cur; } catch (err) {} draw();
  });
  var h = location.hash.slice(1); if (h === 'life' || h === 'stocks') cur = h;
  fetch('pages.json', {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(d){ pages = d; draw(); })
    .catch(function(){ list.innerHTML = '<p class="empty">一覧を読み込めませんでした。電波の状態を確かめて、もう一度開いてください。</p>'; });
})();
</script>
</body>
</html>
